```yaml
name: Dee Labz Laravel QA

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  laravel-tests:
    name: Laravel + MySQL Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dlab
          MYSQL_USER: dlab
          MYSQL_PASSWORD: dlab
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dlab
      DB_USERNAME: dlab
      DB_PASSWORD: dlab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Show PHP and Composer versions
        run: |
          php -v
          composer --version

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -P3306 -udlab -pdlab --silent; then
              echo "MySQL is ready."
              exit 0
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

          echo "MySQL did not become ready."
          exit 1

      - name: Check Laravel application
        run: php artisan about

      - name: Run fresh migrations and seeders
        run: php artisan migrate:fresh --seed --force

      - name: Check migration status
        run: php artisan migrate:status

      - name: Run Laravel tests
        run: php artisan test

      - name: PHP syntax check
        shell: bash
        run: |
          set -e

          echo "Checking PHP syntax..."

          find app bootstrap config database routes tests \
            -type f \
            -name "*.php" \
            -print0 |
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done

          echo "PHP syntax check passed."

      - name: Check application routes
        run: php artisan route:list --except-vendor

      - name: Check config
        run: php artisan config:show database
```
